[project]
name = "aiae-vol4-lab10"
version = "1.0.0"
description = "Applied AI Engineering — Volume IV, Lab 10: PII Detection and Redaction Pipeline"
requires-python = ">=3.12"
# The default path (the regex fallback and the stand-in model) needs nothing beyond the
# standard library.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]
# Live mode only.
live = ["openai>=1.40"]
# Presidio and its spaCy model (about 560 MB). Python 3.14: spaCy's dependencies did not
# build on Python 3.15 at the time of writing, which is why .python-version selects 3.14.
presidio = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8,<3.9",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
