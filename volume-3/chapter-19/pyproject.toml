[project]
name = "aiae-vol3-lab19"
version = "1.0.0"
description = "Applied AI Engineering — Volume III, Lab 19: Intelligent Research Assistant (Capstone)"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8.0"]
# Live mode only. The default mode uses the stand-in model and needs no key.
live = ["openai>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
