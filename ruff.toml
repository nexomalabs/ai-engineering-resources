# Lint configuration for the lab code in volumes/*/labs/.
#
# The rule set is selected explicitly rather than left to ruff's defaults.
# Ruff's defaults have widened considerably between releases — 0.16 enables
# YTT, ASYNC, S, BLE and B among others — so a CI job that does not pin both
# the version and the rule set goes red on an upstream release with no change
# to the code. That is what happened to the companion repository's first CI run.
#
# E, F and I are the core: pycodestyle errors, pyflakes, and import sorting.
# They catch real defects — undefined names, unused imports, shadowed builtins —
# without imposing opinions on teaching code that readers have to read.

line-length = 100
target-version = "py312"

# listings/ holds the books' code listings exactly as printed, exported from the
# manuscript by scripts/export_listings.py. Many are fragments that build on an
# earlier listing, so they cannot pass a linter on their own, and reformatting
# them would make the copy differ from the page. They are reference text, not
# lab code; the labs are what CI holds to this rule set.
extend-exclude = ["volume-*/listings"]

[lint]
select = ["E", "F", "I"]

[format]
docstring-code-format = true

[lint.per-file-ignores]
# Starter files set up a variable and leave the reader to use it in the TODO
# immediately below — `d_k` for the scaled-attention divisor, `n` for the
# gradient denominator. Unused is the intended state until the reader fills
# it in, so F841 is noise here rather than a finding.
"*/src/*.py" = ["F841"]
# Volume II-IV lab code mirrors the listings printed in the book, whose example data
# (mock model responses, ticket text, prompt templates) runs past 100 characters.
# Those strings stay whole so the repository matches the page.
"volume-2/**/*.py" = ["E501"]
"volume-3/**/*.py" = ["E501"]
"volume-4/**/*.py" = ["E501"]
