[project]
name = "aiae-vol2-lab11"
version = "1.0.0"
description = "Applied AI Engineering — Volume II, Lab 11: Building a Multi-Metric Evaluation Pipeline"
requires-python = ">=3.12"
dependencies = ["rouge-score>=0.1.2"]

[dependency-groups]
dev = ["pytest>=8.0"]
# Live and record mode only. Fixture mode, the default, needs no packages and no key.
live = ["openai>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
