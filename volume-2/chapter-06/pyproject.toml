[project]
name = "aiae-vol2-lab06"
version = "1.0.0"
description = "Applied AI Engineering — Volume II, Lab 6: Few-Shot Engineering: Label Balance and Selection"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4"]

[dependency-groups]
dev = ["pytest>=8.0"]
# Live and record mode only. Fixture mode, the default, needs no packages and no key.
live = ["openai>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
