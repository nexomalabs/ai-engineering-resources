[project]
name = "aiae-vol2-lab09"
version = "1.0.0"
description = "Applied AI Engineering — Volume II, Lab 9: Output Control: Schema Enforcement and Validation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[dependency-groups]
dev = ["pytest>=8.0"]
# Live and record mode only. Fixture mode, the default, needs no packages and no key.
live = ["openai>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
